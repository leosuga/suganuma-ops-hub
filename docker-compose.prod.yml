services:
  app:
    container_name: suganuma-ops-hub
    hostname: suganuma-ops-hub
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    expose:
      - "3000"
    networks:
      - proxy
      - internal
    depends_on:
      - ollama

  ollama:
    container_name: ollama
    hostname: ollama
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    expose:
      - "11434"
    networks:
      - internal
    # Default entrypoint serves the API; pull model via deploy script

volumes:
  ollama:

networks:
  proxy:
    external: true
  internal:
    driver: bridge
