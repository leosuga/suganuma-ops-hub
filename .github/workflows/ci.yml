name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Type checking local via VSCode; tsc --noEmit OOM/timeout no Actions
      # - name: TypeScript
      #   run: npx tsc --noEmit

      - name: Build
        run: SKIP_TSC=1 npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Test
        run: npx vitest run

      # Suíte DOM (happy-dom): os testes de componente (*.test.tsx) só rodam
      # com DOM — no Node v25 local travam. O Dockerfile.test já existe.
      # Sem este step, uma remoção de hook (ex.: useHabitEntries) só é
      # discovered depois, quando alguém roda a suíte DOM na mão.
      - name: Test (DOM)
        run: |
          docker build -f Dockerfile.test -t ops-hub-test .
          docker run --rm ops-hub-test
