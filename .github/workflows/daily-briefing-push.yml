name: Daily Briefing Push

on:
  schedule:
    # 11:00 UTC = 08:00 BRT (BRT é UTC-3, sem DST desde 2019)
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Send daily briefing push
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          BODY='{}'
          SIG="sha256=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -binary | xxd -p -c 256)"
          HTTP=$(curl -s -o /tmp/briefing.json -w "%{http_code}" \
            -X POST "https://ops.suganuma.com.br/api/push/send" \
            -H "Content-Type: application/json" \
            -H "x-hub-signature-256: $SIG" \
            -d "$BODY" --max-time 60)
          echo "HTTP $HTTP"
          cat /tmp/briefing.json
          # 200 = enviado ou "nada pendente" (ok); falha real aborta
          [ "$HTTP" = "200" ] || { echo "BRIEFING FAILED"; exit 1; }