name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run unit tests (node env)
        run: npx vitest run

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 40m
          script: |
            export NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}"
            export NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
            export SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
            export WEBHOOK_SECRET="${{ secrets.WEBHOOK_SECRET }}"
            export WEBHOOK_OWNER_ID="${{ secrets.WEBHOOK_OWNER_ID }}"
            export EMAIL_SECRET="${{ secrets.EMAIL_SECRET || '' }}"
            export CSV_SECRET="${{ secrets.CSV_SECRET || '' }}"
            export DEPLOY_SECRET="${{ secrets.DEPLOY_SECRET || '' }}"
            export OLLAMA_URL="${{ secrets.OLLAMA_URL || 'http://ollama:11434' }}"
            export OLLAMA_CLOUD_URL="${{ secrets.OLLAMA_CLOUD_URL || 'https://ollama.com' }}"
            export OLLAMA_API_KEY="${{ secrets.OLLAMA_API_KEY || '' }}"
            export OLLAMA_CHAT_MODEL="${{ secrets.OLLAMA_CHAT_MODEL || 'gpt-oss:20b' }}"
            export QDRANT_URL="${{ secrets.QDRANT_URL || 'http://qdrant:6333' }}"
            export RAINDROP_TOKEN="${{ secrets.RAINDROP_TOKEN || '' }}"
            export RAINDROP_COLLECTION_IDS="${{ secrets.RAINDROP_COLLECTION_IDS || '' }}"
            export RAINDROP_SYNC_SECRET="${{ secrets.RAINDROP_SYNC_SECRET || '' }}"
            export RAINDROP_MAX_ITEMS_PER_RUN="${{ secrets.RAINDROP_MAX_ITEMS_PER_RUN || '50' }}"

            bash << 'RUNDEPLOY'
            cd ~
            rm -rf ops-hub
            git clone --depth 1 https://github.com/leosuga/suganuma-ops-hub.git ops-hub || { echo "GIT CLONE FAILED"; exit 1; }
            cd ops-hub

            echo NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL > .env.prod
            echo NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY >> .env.prod
            echo SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY >> .env.prod
            echo WEBHOOK_SECRET=$WEBHOOK_SECRET >> .env.prod
            echo WEBHOOK_OWNER_ID=$WEBHOOK_OWNER_ID >> .env.prod
            echo EMAIL_SECRET=$EMAIL_SECRET >> .env.prod
            echo CSV_SECRET=$CSV_SECRET >> .env.prod
            echo DEPLOY_SECRET=$DEPLOY_SECRET >> .env.prod
            echo OLLAMA_URL=$OLLAMA_URL >> .env.prod
            echo OLLAMA_CLOUD_URL=$OLLAMA_CLOUD_URL >> .env.prod
            echo OLLAMA_API_KEY=$OLLAMA_API_KEY >> .env.prod
            echo OLLAMA_CHAT_MODEL=$OLLAMA_CHAT_MODEL >> .env.prod
            echo QDRANT_URL=$QDRANT_URL >> .env.prod
            echo RAINDROP_TOKEN=$RAINDROP_TOKEN >> .env.prod
            echo RAINDROP_COLLECTION_IDS=$RAINDROP_COLLECTION_IDS >> .env.prod
            echo RAINDROP_SYNC_SECRET=$RAINDROP_SYNC_SECRET >> .env.prod
            echo RAINDROP_MAX_ITEMS_PER_RUN=$RAINDROP_MAX_ITEMS_PER_RUN >> .env.prod

            NET=$(docker inspect caddy_proxy --format '{{json .NetworkSettings.Networks}}' 2>/dev/null | python3 -c "import sys,json; print(list(json.load(sys.stdin).keys())[0])" 2>/dev/null || echo "")
            if [ -z "$NET" ]; then
              NET=$(docker network ls --filter name=proxy -q | head -1)
              if [ -z "$NET" ]; then
                echo "FAILED: Could not detect proxy network"
                exit 1
              fi
            fi
            echo "Network: $NET"

            # Ensure Ollama container is running for embeddings
            if ! docker ps --format '{{.Names}}' | grep -q "^ollama$"; then
              docker run -d \
                --name ollama \
                --hostname ollama \
                --network "$NET" \
                -v ollama:/root/.ollama \
                --restart unless-stopped \
                ollama/ollama:latest || echo "WARN: Ollama container start failed"
              sleep 8
              docker exec ollama ollama pull nomic-embed-text || echo "WARN: nomic-embed-text pull failed"
            fi

            echo "Verifying source files..."
            ls -la src/app/\(app\)/calendar/year/ || true
            ls -la src/components/annual/ || true

            # Extract expected SW version from source
            EXPECTED_SW=$(grep 'const CACHE' public/sw.js | sed 's/.*"\(ops-hub-v[0-9]*\)".*/\1/')
            echo "Expected SW version: $EXPECTED_SW"

            echo "Building (2-5 min)..."
            GIT_SHA=$(git rev-parse --short HEAD)
            echo "Image tag: ops-hub:$GIT_SHA"
            docker build \
              --build-arg NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
              --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
              --no-cache \
              -t "ops-hub:$GIT_SHA" \
              -t ops-hub:latest . || { echo "BUILD FAILED"; exit 1; }

            echo "Build output check:"
            ls -la .next/standalone/ 2>/dev/null || true
            ls -la .next/standalone/server/ 2>/dev/null || true
            cat .next/app-path-routes-manifest.json 2>/dev/null | grep -E "calendar|year" || true

            echo "Switching containers..."
            docker stop suganuma-ops-hub 2>/dev/null || true
            docker rm suganuma-ops-hub 2>/dev/null || true

            docker run -d \
              --name suganuma-ops-hub \
              --hostname suganuma-ops-hub \
              --network "$NET" \
              --env-file .env.prod \
              --restart unless-stopped \
              ops-hub:latest || { echo "CONTAINER START FAILED"; exit 1; }

            sleep 5
            if ! docker ps --format '{{.Names}}' | grep -q "^suganuma-ops-hub$"; then
              echo "FAILED: Container not running after start"
              docker logs suganuma-ops-hub --tail 20 || true
              exit 1
            fi

            # Prune old tagged images (keep newest 5 incl. latest for rollback) — non-critical
            docker images ops-hub --format '{{.Tag}}' | tail -n +6 | sed 's/^/ops-hub:/' | xargs -r docker rmi 2>/dev/null || true

            if [ -f ~/update-ops-proxy.sh ]; then
              bash ~/update-ops-proxy.sh || echo "WARN: proxy update script failed (non-critical)"
            fi

            for i in 1 2 3 4 5 6; do
              sleep 10
              SW=$(curl -s --max-time 5 https://ops.suganuma.com.br/sw.js 2>/dev/null || echo "-ERROR-")
              echo "[$i] sw.js raw: $SW"
              echo "[$i] checking $EXPECTED_SW..."
              echo "$SW" | grep "$EXPECTED_SW" && echo "[$i] $EXPECTED_SW FOUND"
              echo "[$i] checking image..."
              docker ps --format '{{.Image}}' | grep "ops-hub:latest" && echo "[$i] IMAGE FOUND"
              if echo "$SW" | grep -q "$EXPECTED_SW" && docker ps --format '{{.Image}}' | grep -q "ops-hub:latest"; then
                echo "DEPLOY OK"
                exit 0
              fi
              echo "[$i] checks failed, retrying..."
            done
            echo "DEPLOY WARNING: sw.js not reachable or version mismatch"
            echo "Container status:"
            docker ps | grep suganuma-ops-hub || true
            echo "Container image:"
            docker inspect --format='{{.Config.Image}}' suganuma-ops-hub 2>/dev/null || true
            echo "---"
            echo "Checking /calendar/year response:"
            curl -s --max-time 5 https://ops.suganuma.com.br/calendar/year | head -c 200 || true
            echo ""
            echo "FAILED: Deploy verification failed"
            exit 1
            RUNDEPLOY
